# General
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Nordic's own reference boards for this SoC (nrf54lm20dk, nrf54l15dk) enable
# this by default in their board Kconfig.defconfig ("default
# ARCH_HAS_STACK_PROTECTION"); the XIAO board port never added that default,
# so a stack overflow on this board silently corrupts adjacent memory instead
# of being caught cleanly - manifesting as a confusing crash far from the
# actual cause (observed: "USAGE FAULT: Illegal load of EXC_RETURN into PC").
# Enabling it here turns any future overflow into a clear "stack overflow"
# fatal error instead.
CONFIG_HW_STACK_PROTECTION=y

# Bluetooth core
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="NCS Broadcast Assistant"
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_SMP=y
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Both default to 1. Sinks stay connected once picked - toggling one between
# receiving and not receiving the source reuses its existing connection
# rather than reconnecting - so multiple sinks can be connected (and bonded)
# at once. Sized to BLE_SCAN_CTRL_MAX_SINK_CONN in ble_scan_ctrl.h, the most
# sinks this sample will ever try to hold open at the same time. Observed on
# hardware before this was raised: bonding a second sink while a first bond
# was still held failed synchronously with -ENOMEM.
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# Explicitly require the Nordic SoftDevice Controller. This SoC's
# devicetree (plus boards/xiao_nrf54lm20a_nrf54lm20a_cpuapp.overlay, which
# disables the alternative &bt_hci_controller node) already makes this the
# Kconfig default, but pinning it here makes the choice self-documenting
# and keeps the build from silently falling back to Zephyr's open-source
# BT_LL_SW_SPLIT controller if the devicetree ever changes.
CONFIG_BT_LL_SOFTDEVICE=y
# Not CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX: that symbol belongs to BT_LL_SW_SPLIT
# only, and does not apply to the SoftDevice Controller.

# LE Audio: Broadcast Assistant (BASS client) role
# CONFIG_UTF8 and CONFIG_BT_AUDIO gate the whole subsys/bluetooth/audio
# Kconfig tree (see zephyr/subsys/bluetooth/audio/Kconfig: "menuconfig
# BT_AUDIO depends on UTF8" followed by "if BT_AUDIO" wrapping Kconfig.bap).
# Without them, BT_BAP_BASS_MAX_SUBGROUPS and
# BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE below are never defined, which is
# why the build failed.
CONFIG_UTF8=y
CONFIG_BT_AUDIO=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_ISO_SYNC_RECEIVER=y
CONFIG_BT_BAP_BROADCAST_ASSISTANT=y
CONFIG_BT_BAP_BASS_MAX_SUBGROUPS=2
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=255

# Display + touch input
CONFIG_DISPLAY=y
CONFIG_INPUT=y

# Real-time clock (PCF8563, wired up by the seeed_xiao_round_display shield's
# devicetree and aliased as "rtc") backing the idle clock screen.
CONFIG_RTC=y

# LVGL
CONFIG_LVGL=y
CONFIG_LV_Z_LVGL_MUTEX=y
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_LIST=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_BUTTONMATRIX=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
